name: Spike

# Staged investigation of the ACTUAL KiCad 10.0.1 running on iPadOS.
# Each job answers one question and always uploads its logs, pass or fail.
# Free standard runners only (public repo).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        type: choice
        default: wx-desktop
        options:
          - wx-desktop
          - wx-ios
          - kicad-desktop
          - deps-ios
          - occ-ios
          - ngspice-ios
          - python-ios
          - kicad-ios
          - all

jobs:
  wx-desktop:
    if: ${{ inputs.stage == 'wx-desktop' || inputs.stage == 'all' }}
    name: wx fork + wxQt backend (macOS desktop probe)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Stage wx-desktop
        run: bash scripts/stage-wx-desktop.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-wx-desktop
          path: work/logs
          if-no-files-found: ignore

  wx-ios:
    if: ${{ inputs.stage == 'wx-ios' || inputs.stage == 'all' }}
    name: wx fork + wxQt backend (iOS arm64)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Stage wx-ios
        run: bash scripts/stage-wx-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-wx-ios
          path: work/logs
          if-no-files-found: ignore

  deps-ios:
    if: ${{ inputs.stage == 'deps-ios' || inputs.stage == 'all' }}
    name: iOS dependency sysroot (part 1, CMake deps)
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Stage deps-ios
        run: bash scripts/stage-deps-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-deps-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-part1
          path: work/sysroot-ios
          if-no-files-found: ignore

  kicad-desktop:
    if: ${{ inputs.stage == 'kicad-desktop' || inputs.stage == 'all' }}
    name: KiCad 10.0.1 vs wxQt (desktop configure + manager build)
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Stage kicad-desktop
        run: bash scripts/stage-kicad-desktop.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-kicad-desktop
          path: work/logs
          if-no-files-found: ignore

  occ-ios:
    if: ${{ inputs.stage == 'occ-ios' || inputs.stage == 'all' }}
    name: OpenCascade 7.8.1 for iOS
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Stage occ-ios
        run: bash scripts/stage-occ-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-occ-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-occ
          path: work/sysroot-ios
          if-no-files-found: ignore

  ngspice-ios:
    if: ${{ inputs.stage == 'ngspice-ios' || inputs.stage == 'all' }}
    name: ngspice 44.2 for iOS
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Stage ngspice-ios
        run: bash scripts/stage-ngspice-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ngspice-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-ngspice
          path: work/sysroot-ios
          if-no-files-found: ignore

  python-ios:
    if: ${{ inputs.stage == 'python-ios' || inputs.stage == 'all' }}
    name: CPython (BeeWare 3.13) for iOS sysroot
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage python-ios
        run: bash scripts/stage-python-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-python-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-python
          path: work/sysroot-ios
          if-no-files-found: ignore

  kicad-ios:
    permissions:
      actions: read
      contents: read
    if: ${{ inputs.stage == 'kicad-ios' }}
    name: KiCad 10.0.1 for iOS arm64
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: Assemble sysroot from stage artifacts
        # download-artifact only sees artifacts from THIS run; the sysroot
        # pieces were uploaded by earlier stage runs, so fetch the latest
        # artifact of each name through the API instead. The download URL
        # 302-redirects to blob storage, which rejects the Authorization
        # header — strip it on redirect.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYEOF'
          import json, os, sys, urllib.request, zipfile, io
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          class NoAuthRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  r = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if r is not None:
                      r.remove_header("Authorization")
                  return r
          opener = urllib.request.build_opener(NoAuthRedirect)
          def get(url):
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + token, "Accept": "application/vnd.github+json"})
              return opener.open(req)
          want = ["sysroot-ios-part1", "sysroot-ios-occ", "sysroot-ios-ngspice", "sysroot-ios-python"]
          arts = json.load(get(f"https://api.github.com/repos/{repo}/actions/artifacts?per_page=100"))["artifacts"]
          os.makedirs("work/sysroot-ios", exist_ok=True)
          got = []
          for name in want:
              cands = [a for a in arts if a["name"] == name and not a["expired"]]
              if not cands:
                  print("MISSING artifact:", name); continue
              a = cands[0]
              data = get(a["archive_download_url"]).read()
              zipfile.ZipFile(io.BytesIO(data)).extractall("work/sysroot-ios")
              got.append(f"{name} ({a['size_in_bytes']} B, run {a['workflow_run']['id']})")
          print("merged:", "; ".join(got))
          if len(got) != len(want):
              sys.exit("sysroot merge incomplete")
          PYEOF
          test -f work/sysroot-ios/include/glm/glm.hpp || { echo "MERGE BROKEN: glm missing"; exit 1; }
          test -f work/sysroot-ios/lib/libboost_locale.a || { echo "MERGE BROKEN: boost missing"; exit 1; }
          ls work/sysroot-ios/lib | head -30
      - name: Restore host tools
        run: |
          mkdir -p work/host-tools
          if [ -f work/sysroot-ios/host-tools/protoc ]; then cp work/sysroot-ios/host-tools/protoc work/host-tools/protoc && chmod +x work/host-tools/protoc; else echo "no stashed protoc"; fi
          ls work/sysroot-ios/lib | head -30
      - name: Install Qt 6.9.3 (iOS + desktop host kits)
        run: |
          pip3 install --quiet --break-system-packages aqtinstall
          python3 -m aqt install-qt mac ios 6.9.3 ios --outputdir "$GITHUB_WORKSPACE/Qt" --archives qtbase qttools qtdeclarative qtsvg qtshadertools
          python3 -m aqt install-qt mac desktop 6.9.3 clang_64 --outputdir "$GITHUB_WORKSPACE/Qt" --archives qtbase qttools
          cp -R "$GITHUB_WORKSPACE/Qt" work/Qt
      - name: Stage kicad-ios
        run: bash scripts/stage-kicad-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-kicad-ios
          path: work/logs
          if-no-files-found: ignore

name: Spike

# Staged investigation of the ACTUAL KiCad 10.0.1 running on iPadOS.
# Each job answers one question and always uploads its logs, pass or fail.
# Free standard runners only (public repo).

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "Which stage to run"
        type: choice
        default: wx-desktop
        options:
          - wx-desktop
          - wx-ios
          - kicad-desktop
          - deps-ios
          - occ-ios
          - ngspice-ios
          - python-ios
          - all

jobs:
  wx-desktop:
    if: ${{ inputs.stage == 'wx-desktop' || inputs.stage == 'all' }}
    name: wx fork + wxQt backend (macOS desktop probe)
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Stage wx-desktop
        run: bash scripts/stage-wx-desktop.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-wx-desktop
          path: work/logs
          if-no-files-found: ignore

  wx-ios:
    if: ${{ inputs.stage == 'wx-ios' || inputs.stage == 'all' }}
    name: wx fork + wxQt backend (iOS arm64)
    runs-on: macos-26
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Stage wx-ios
        run: bash scripts/stage-wx-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-wx-ios
          path: work/logs
          if-no-files-found: ignore

  deps-ios:
    if: ${{ inputs.stage == 'deps-ios' || inputs.stage == 'all' }}
    name: iOS dependency sysroot (part 1, CMake deps)
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Stage deps-ios
        run: bash scripts/stage-deps-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-deps-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-part1
          path: work/sysroot-ios
          if-no-files-found: ignore

  kicad-desktop:
    if: ${{ inputs.stage == 'kicad-desktop' || inputs.stage == 'all' }}
    name: KiCad 10.0.1 vs wxQt (desktop configure + manager build)
    runs-on: macos-26
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Stage kicad-desktop
        run: bash scripts/stage-kicad-desktop.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-kicad-desktop
          path: work/logs
          if-no-files-found: ignore

  occ-ios:
    if: ${{ inputs.stage == 'occ-ios' || inputs.stage == 'all' }}
    name: OpenCascade 7.8.1 for iOS
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Stage occ-ios
        run: bash scripts/stage-occ-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-occ-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-occ
          path: work/sysroot-ios
          if-no-files-found: ignore

  ngspice-ios:
    if: ${{ inputs.stage == 'ngspice-ios' || inputs.stage == 'all' }}
    name: ngspice 44.2 for iOS
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Stage ngspice-ios
        run: bash scripts/stage-ngspice-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-ngspice-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-ngspice
          path: work/sysroot-ios
          if-no-files-found: ignore

  python-ios:
    if: ${{ inputs.stage == 'python-ios' || inputs.stage == 'all' }}
    name: CPython (BeeWare 3.13) for iOS sysroot
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Stage python-ios
        run: bash scripts/stage-python-ios.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-python-ios
          path: work/logs
          if-no-files-found: ignore
      - name: Upload sysroot
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: sysroot-ios-python
          path: work/sysroot-ios
          if-no-files-found: ignore
